<html lang="es">

<meta name="mobile-web-app-capable" content="yes">

<title>Ritmo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: una columna estrecha de móvil, barra inferior de 4 pestañas y botón de captura flotante */
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --ink:#18202F; --muted:#5A6479; --line:#D9DFEA;
  --accent:#2F4BC9; --accent-ink:#FFFFFF; --soft:#E3E8F6;
  --mark:#FFDF5E; --mark-ink:#2E2500; --hl:#FFDF5E; --ok:#16875C; --ok-soft:#DDF3EA;
  --shadow:0 1px 2px rgba(20,30,60,.06),0 6px 20px rgba(20,30,60,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F131B; --surface:#181D28; --ink:#E8ECF4; --muted:#98A2B8; --line:#2A3142;
  --accent:#8FA3FF; --accent-ink:#0B0F1C; --soft:#222A3C;
  --mark:#E9C84A; --mark-ink:#221A00; --hl:rgba(233,200,74,.32); --ok:#4FCB97; --ok-soft:#143327;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F131B; --surface:#181D28; --ink:#E8ECF4; --muted:#98A2B8; --line:#2A3142;
  --accent:#8FA3FF; --accent-ink:#0B0F1C; --soft:#222A3C;
  --mark:#E9C84A; --mark-ink:#221A00; --hl:rgba(233,200,74,.32); --ok:#4FCB97; --ok-soft:#143327;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 170px}

/* cabecera */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 14px}
.top .day{font-size:14px;color:var(--muted);letter-spacing:.01em}
.top h1{font-size:28px;font-weight:800;letter-spacing:-.01em}
.iconbtn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--soft)}

.label{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 4px 8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.label small{letter-spacing:0;text-transform:none;font-weight:400}
.hint{color:var(--muted);font-size:15px;margin:4px 4px 0}

/* tarjeta AHORA */
.now{background:var(--surface);border-radius:24px;padding:22px 20px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.now .kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.now h2{font-size:30px;line-height:1.12;font-weight:800;letter-spacing:-.015em}
.now h2 .hl{background:linear-gradient(transparent 58%,var(--hl) 58%);padding:0 2px}
.step{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start}
.step b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.step .s-edit{color:var(--accent);font-weight:700;font-size:15px;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{min-height:54px;border-radius:14px;font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px;border:2px solid transparent}
.btn.primary{background:var(--accent);color:var(--accent-ink);grid-column:1/-1;font-size:19px;min-height:60px}
.btn.ghost{background:var(--soft)}
.btn.done{background:var(--ok-soft);color:var(--ok)}
.btn.line{border-color:var(--line)}
.btn.small{min-height:42px;font-size:15px;border-radius:12px;padding:0 12px}
.energy{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.energy span{font-size:14px;color:var(--muted);margin-right:2px}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.mark{background:var(--mark);color:var(--mark-ink)}
.pill.ex{background:transparent;border:1px dashed var(--line)}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--c,var(--muted))}
.chipbtn{font-size:15px;font-weight:700;padding:8px 13px;border-radius:999px;background:var(--soft);color:var(--ink);border:2px solid transparent}
.chipbtn[aria-pressed="true"]{border-color:var(--accent);background:var(--surface);color:var(--accent)}

/* listas */
ul.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{background:var(--surface);border-radius:var(--r);display:flex;align-items:center;gap:4px;padding:6px 4px 6px 6px;box-shadow:var(--shadow)}
.task.imp{box-shadow:inset 4px 0 0 var(--mark),var(--shadow)}
.task .cb{flex:none;width:44px;height:44px;display:grid;place-items:center}
.task .cb i{width:26px;height:26px;border-radius:9px;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent;transition:transform .15s}
.task.done .cb i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.task .cb:active i{transform:scale(.85)}
.task .tb{flex:1;min-width:0;text-align:left;padding:6px 4px;display:flex;flex-direction:column;gap:4px}
.task .tt{overflow-wrap:anywhere}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .meta{display:flex;gap:6px;flex-wrap:wrap}
.task .meta:empty{display:none}
.task .ib{flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.task .ib.on{color:var(--mark-ink);background:var(--mark)}
.quick{display:flex;gap:6px;padding:0 6px 8px 54px;flex-wrap:wrap}
.task.col{flex-direction:column;align-items:stretch}
.task.col .row{display:flex;align-items:center;gap:4px}
.slot{border:2px dashed var(--line);border-radius:var(--r);padding:14px 16px;color:var(--muted);font-size:15px}
.empty{text-align:center;color:var(--muted);padding:28px 16px;background:var(--surface);border-radius:20px}
.empty h3{color:var(--ink);font-size:22px;margin-bottom:6px}
.banner{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px}
details.donebox{margin-top:8px}
details.donebox summary{cursor:pointer;list-style:none;padding:12px 4px;color:var(--ok);font-weight:700}
details.donebox summary::-webkit-details-marker{display:none}
.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .3s}

/* rutinas */
.rcard{background:var(--surface);border-radius:20px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rhead h3{font-size:22px}
.rhead .sub{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.ritem{display:flex;align-items:center;gap:6px;min-height:44px}
.ritem .cb{width:40px;height:40px;display:grid;place-items:center;flex:none}
.ritem .cb i{width:24px;height:24px;border-radius:8px;border:2.5px solid var(--line);display:grid;place-items:center;color:transparent}
.ritem.on .cb i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ritem.on .rt{color:var(--muted);text-decoration:line-through}
.ritem .rt{flex:1;min-width:0}
.ritem .rm{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.rrow{display:flex;gap:8px;flex-wrap:wrap}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.field{width:100%;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:17px}
.field:focus{border-color:var(--accent);outline:none}
.field.mini{width:84px;flex:none}

/* barra inferior */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:13px;font-weight:700;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--accent)}
.tab .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--mark);color:var(--mark-ink);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.fab{position:fixed;z-index:21;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 78px);height:62px;padding:0 22px 0 18px;border-radius:31px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;box-shadow:0 8px 24px rgba(30,50,160,.35)}
.fab.idea{right:auto;left:max(18px,calc(env(safe-area-inset-left,0px) + 18px));width:62px;padding:0;justify-content:center;background:var(--mark);color:var(--mark-ink);box-shadow:0 8px 24px rgba(120,90,0,.3)}
@media (min-width:600px){.fab{right:calc(50% - 280px + 18px)}.fab.idea{left:calc(50% - 280px + 18px)}}
.cap.idea textarea{border-color:var(--mark)}
.group{font-weight:700;margin:14px 4px 6px;display:flex;align-items:center;gap:8px}

/* hojas inferiores */
.scrim{position:fixed;inset:0;background:rgba(10,14,25,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
.sheet h3{font-size:22px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 0}
.sheet .sec{display:flex;flex-direction:column;gap:8px}
.sheet .sec > b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.cap{display:flex;gap:8px;align-items:stretch}
.cap textarea{flex:1;min-width:0;resize:none;height:84px;font-size:20px;border:2px solid var(--accent);border-radius:14px;padding:12px;background:var(--surface)}
.cap textarea:focus{outline:none}
.cap .side{display:flex;flex-direction:column;gap:8px}
.cap .side button{width:52px;flex:1;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.cap .side .go{background:var(--accent);color:var(--accent-ink)}
.cap .side .rec{background:var(--mark);color:var(--mark-ink)}
.parsed{display:flex;gap:6px;flex-wrap:wrap;min-height:26px;align-items:center;color:var(--muted);font-size:14px}

/* foco a pantalla completa */
.focus{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 18px) max(18px,env(safe-area-inset-left,0px))}
.focus .in{width:100%;max-width:520px;display:flex;flex-direction:column;gap:18px;flex:1}
.focus .ft{display:flex;justify-content:space-between;align-items:center}
.focus h2{font-size:30px;line-height:1.15;text-align:center}
.ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:4px auto;max-width:100%}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .tm{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:56px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.ring .tm small{display:block;font-family:var(--f-body);font-size:15px;font-weight:400;color:var(--muted);text-align:center;letter-spacing:0}
.focus .stepbig{background:var(--surface);border-radius:18px;padding:16px;text-align:center;font-size:19px}
.focus .stepbig b{display:block;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:4px}
.focus .grow{flex:1}

/* avisos */
.alert{position:fixed;z-index:60;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 12px);width:calc(100% - 24px);max-width:520px;background:#18202F;color:#F2F4F8;border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:16px;box-shadow:0 12px 40px rgba(0,0,0,.35);display:flex;flex-direction:column;gap:10px;animation:drop .25s ease-out}
.alert b{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.75}
.alert .at{font-size:20px;font-weight:700}
.alert .ab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.alert .ab button{min-height:46px;border-radius:12px;background:rgba(127,127,127,.25);font-weight:700;font-size:15px}
.alert .ab button.y{background:#FFDF5E;color:#2E2500}
@keyframes drop{from{transform:translate(-50%,-20px);opacity:0}}
.toast{position:fixed;z-index:55;left:16px;right:16px;margin:0 auto;width:fit-content;bottom:calc(env(safe-area-inset-bottom,0px) + 150px);background:#18202F;color:#F2F4F8;border:1px solid rgba(255,255,255,.12);padding:12px 16px;border-radius:14px;display:flex;gap:14px;align-items:center;font-weight:700;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast button{color:#FFDF5E;font-weight:700}
.burst{position:fixed;z-index:70;pointer-events:none;width:8px;height:8px;border-radius:2px;animation:fly .8s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

</head>
<body>
<div class="wrap"><main id="view"></main></div>

<button class="fab" id="fab" data-act="capture" aria-label="Apuntar algo">
  <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Apuntar
</button>
<button class="fab idea" id="fabidea" data-act="idea" aria-label="Idea rápida por voz para revisar en casa"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
<nav class="dock" aria-label="Secciones"><div class="tabs" id="tabs"></div></nav>
<div id="layer"></div>

<script>
(function(){
"use strict";
const KEY="ritmo.v1";
const $=s=>document.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,10);
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>ymd(new Date());
const addDays=(s,n)=>{const d=new Date(s+"T12:00:00");d.setDate(d.getDate()+n);return ymd(d)};
const hmNow=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const toMin=hm=>{const [h,m]=hm.split(":").map(Number);return h*60+m};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const AREA_COLORS=["#3B5BDB","#D9480F","#0CA678","#9C36B5","#E8A010","#C2255C"];

const I={
 check:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 star:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>',
 starF:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.9l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z"/></svg>',
 more:'<svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
 mic:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
 send:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
 gear:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>',
 clock:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
 x:'<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
 play:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg>',
 tNow:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>',
 tToday:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>',
 tInbox:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 13l2.5-8h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg>',
 tRout:'<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12a8 8 0 0113.7-5.7L20 8.5M20 4v4.5h-4.5M20 12a8 8 0 01-13.7 5.7L4 15.5M4 20v-4.5h4.5"/></svg>'
};

/* ---------- datos ---------- */
let S=null;

/* Lo pendiente se reprograma solo: lo que era para antes pasa a hoy sin avisos rojos */
function rollover(){
  const t=today();
  S.tasks.forEach(k=>{
    if(!k.done && (k.status==="today"||k.status==="later") && k.date && k.date<t){k.date=t;k.status="today";k.carried=true;}
    if(!k.done && k.status==="later" && k.date===t){k.status="today";}
  });
  if(S.lastDay!==t){ // limpiar avisos viejos
    const keep={};Object.keys(S.notified).forEach(k=>{if(k.endsWith(t))keep[k]=S.notified[k]});S.notified=keep;S.lastDay=t;S.energy="";
  }
  save();
}

/* ---------- interpretar la captura ---------- */
const DOW=["domingo","lunes","martes","miércoles","jueves","viernes","sábado"];
function parse(text){
  const l=" "+text.toLowerCase()+" ";
  let date="",when="",time="",area="";
  const t=today();
  if(/\spasado mañana\s/.test(l)){date=addDays(t,2);when="Pasado mañana"}
  else if(/\smañana\s/.test(l.replace(/(por|de|esta) la mañana/g,""))){date=addDays(t,1);when="Mañana"}
  else if(/\s(hoy|esta tarde|esta noche|ahora)\s/.test(l)){date=t;when="Hoy"}
  else{
    const m=l.match(/\s(el |este |el próximo |el proximo )?(lunes|martes|miércoles|miercoles|jueves|viernes|sábado|sabado|domingo)\s/);
    if(m){let name=m[2].replace("miercoles","miércoles").replace("sabado","sábado");const target=DOW.indexOf(name);const cur=new Date().getDay();let diff=(target-cur+7)%7;if(diff===0)diff=7;date=addDays(t,diff);when=name[0].toUpperCase()+name.slice(1)}
    else if(/\s(la )?semana que viene\s|\spróxima semana\s|\sproxima semana\s/.test(l)){date=addDays(t,7);when="En una semana"}
  }
  const m=l.match(/\sa las? (\d{1,2})(?:[:.h](\d{2}))?\s?(y media|y cuarto)?/)||l.match(/\s(\d{1,2})[:h](\d{2})\s/);
  if(m){let h=+m[1],mi=+(m[2]||0);if(m[3]==="y media")mi=30;if(m[3]==="y cuarto")mi=15;
    if(h<12&&/(de la tarde|de la noche|esta tarde|esta noche|por la tarde)/.test(l))h+=12;
    else if(h>=1&&h<=7&&!/(de la mañana|por la mañana|madrugada)/.test(l))h+=12;
    if(h<24&&mi<60)time=pad(h)+":"+pad(mi);}
  if(time&&!date){date=t;when="Hoy"; if(toMin(time)<toMin(hmNow())){date=addDays(t,1);when="Mañana"}}
  for(const a of S.areas){if(l.includes(a.toLowerCase())){area=a;break}}
  if(!area){for(const a of S.areas){const ws=(S.kw||{})[a]||[];if(ws.some(w=>new RegExp("(^|[^a-záéíóúñ])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"([^a-záéíóúñ]|$)").test(l))){area=a;break}}}
  return {date,when,time,area};
}

function updParsed(){
  const ta=$("#capt");if(!ta)return;

    const a=capArea!==null?capArea:p.area;
    if(ta.value.trim())$("#parsed").innerHTML=`<span class="pill mark">revisar en casa</span>${a?areaPill(a):'<span>Sin proyecto claro: elige uno o déjalo así</span>'}`;
    $("#capchips").innerHTML=S.areas.map(x=>`<button class="chipbtn" data-act="caparea" data-a="${esc(x)}" aria-pressed="${a===x}">${esc(x)}</button>`).join("");
    return;
  }
  const auto=p.date?(p.date===today()?"today":"date"):"inbox";

    s+=cur==="inbox"?`<span>Va a la bandeja</span>`:cur==="today"?`<span class="pill mark">Hoy</span>`:cur==="tomorrow"?`<span class="pill mark">Mañana</span>`:cur==="someday"?`<span class="pill mark">Algún día</span>`:`<span class="pill mark">${esc(p.when||niceDate(p.date))}</span>`;
    if(p.time&&cur!=="inbox"&&cur!=="someday")s+=`<span class="pill">${I.clock}aviso ${p.time}</span>`;
    if(p.area)s+=areaPill(p.area);

  }
  $("#capchips").innerHTML=[["inbox","Bandeja"],["today","Hoy"],["tomorrow","Mañana"],["someday","Algún día"]].map(([k,l])=>`<button class="chipbtn" data-act="capwhen" data-w="${k}" aria-pressed="${cur===k||(k==="tomorrow"&&cur==="date"&&p.date===addDays(today(),1))}">${l}</button>`).join("");
}
function capSave(){
  const ta=$("#capt");if(!ta)return;
  const text=ta.value.trim();if(!text){ta.focus();return}
  const p=parse(text);
  let w=capWhen||(p.date?(p.date===today()?"today":"date"):"inbox");
  const k={id:uid(),text,step:"",mins:0,energy:"",status:"inbox",date:"",time:"",important:false,area:p.area,done:false,doneAt:0,order:Date.now(),created:Date.now()};
  if(capIdea){k.review=true;k.area=capArea!==null?capArea:p.area;S.tasks.push(k);save();closeSheet();
    toast("Idea guardada"+(k.area?" en "+k.area:"")+" para revisar en casa",()=>{S.tasks=S.tasks.filter(x=>x.id!==k.id);save();render()});return}
  if(w==="today"){k.status="today";k.date=today();k.time=p.date===today()?p.time:"";}
  else if(w==="tomorrow"){k.status="later";k.date=addDays(today(),1);k.time=p.time;}
  else if(w==="date"){k.status="later";k.date=p.date;k.time=p.time;}
  else if(w==="someday"){k.status="someday";}
  S.tasks.push(k);save();
  ta.value="";capWhen=null;updParsed();ta.focus();
  toast(k.status==="inbox"?"Apuntado en la bandeja":k.status==="someday"?"Guardado para algún día":"Apuntado para "+niceDate(k.date).toLowerCase()+(k.time?" a las "+k.time:""),()=>{S.tasks=S.tasks.filter(x=>x.id!==k.id);save();render()});
  renderTabs();
}
let rec=null;
function mic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;

function ringSVG(p){const r=46,c=2*Math.PI*r;return `<svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--soft)" stroke-width="7"/><circle id="arc" cx="50" cy="50" r="${r}" fill="none" stroke="var(--accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/></svg>`}

  if(focusId&&$("#tmv")){$("#tmv").textContent=fmt(left);const a=$("#arc");if(a){const c=2*Math.PI*46;a.setAttribute("stroke-dashoffset",c*(1-left/T.dur))}}

/* ---------- recordatorios ---------- */
let AC=null;
function ensureAudio(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==="suspended")AC.resume().catch(()=>{})}
function beep(){
  if(!S.settings.sound||!AC)return;
  try{[0,0.22].forEach((t,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=i?880:660;g.gain.setValueAtTime(0.0001,AC.currentTime+t);g.gain.exponentialRampToValueAtTime(0.25,AC.currentTime+t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+t+0.35);o.connect(g);g.connect(AC.destination);o.start(AC.currentTime+t);o.stop(AC.currentTime+t+0.4)})}catch(e){}
}
function sysNotify(title,body){
  try{
    if(!("Notification" in window)||Notification.permission!=="granted")return;
    if(navigator.serviceWorker&&navigator.serviceWorker.controller){navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,tag:"ritmo",renotify:true,icon:"icon-192.png",badge:"icon-192.png"})).catch(()=>{try{new Notification(title,{body})}catch(e){}})}
    else new Notification(title,{body});
  }catch(e){}
}
function ping(title,body,soft){beep();if(navigator.vibrate)try{navigator.vibrate([180,80,180])}catch(e){};if(document.hidden||!soft)sysNotify(title,body)}
let alertQ=null;
function showAlert(a){
  alertQ=a;let el=$("#alert");
  if(!el){el=document.createElement("div");el.className="alert";el.id="alert";el.setAttribute("role","alertdialog");layer.appendChild(el)}

  <div class="ab">${a.kind==="h"?`<button class="y" data-act="al-ideas">Ver ideas</button><button data-act="al-snooze">+15 min</button><button data-act="al-skip">Hoy no</button>`:a.kind==="r"?`<button class="y" data-act="alr-go">Empezar</button><button data-act="al-snooze">+15 min</button><button data-act="al-skip">Hoy no</button>`

}
function hideAlert(){alertQ=null;const el=$("#alert");el&&el.remove()}
/* Insistente pero amable: repite cada X min hasta que respondes */
function checkReminders(){
  const t=today(), now=toMin(hmNow()), nagMs=(S.settings.nag||5)*60000;
  if(S.lastDay!==t){rollover();render()}
  const due=[];
  S.tasks.forEach(k=>{if(!k.done&&k.status==="today"&&k.date===t&&k.time&&toMin(k.time)<=now)due.push({kind:"t",id:k.id,text:k.text,time:k.time,key:"t"+k.id+k.time+t})});
  S.routines.forEach(r=>{if(!S.notified["skip"+r.id+t]&&r.time&&r.items.length&&toMin(r.time)<=now&&now-toMin(r.time)<180&&rDone(r)<r.items.length)due.push({kind:"r",id:r.id,text:"Rutina de "+r.name.toLowerCase(),time:r.time,key:"r"+r.id+r.time+t})});
  const hs=S.settings.home, nI=ideas().length;
  if(hs&&nI&&toMin(hs)<=now)due.push({kind:"h",id:"home",text:`Tienes ${nI} idea${nI>1?"s":""} para revisar`,time:hs,key:"h"+hs+t});
  for(const a of due){
    const n=S.notified[a.key];
    if(n&&n.answered)continue;
    if(n&&n.snooze&&Date.now()<n.snooze)continue;
    const late=now-toMin(a.time);
    if(!n&&late>120){S.notified[a.key]={answered:true,quiet:true};continue} // muy antiguo: no molestar de golpe
    if(!n||Date.now()-n.last>=nagMs||(alertQ===null&&!n.shown)){
      S.notified[a.key]={last:Date.now(),count:(n?n.count:0)+1,shown:true};save();
      showAlert(a);ping(a.kind==="r"||a.kind==="h"?a.text:"Recordatorio",a.kind==="r"?"Toca ahora":a.kind==="h"?"Al llegar a casa":a.text);
      break;
    } else if(!alertQ){showAlert(a);break}
  }
}

function complete(k,ev){

  if(S.timer&&S.timer.id===k.id)S.timer=null;
  save();
  const r=ev&&ev.target.getBoundingClientRect?ev.target.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:0,height:0};
  celebrate(r.left+r.width/2,r.top+r.height/2);
  toast(CHEERS[Math.floor(Math.random()*CHEERS.length)],()=>{k.done=false;k.doneAt=0;save();render()});
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;
  ensureAudio();
  const act=b.dataset.act,id=b.dataset.id,k=id?byId(id):null;
  const r=b.dataset.r?S.routines.find(x=>x.id===b.dataset.r):null;
  switch(act){
    case"tab":tab=b.dataset.tab;try{sessionStorage.setItem("ritmo.tab",tab)}catch(e){};closePlay();render();scrollTo(0,0);break;
    case"capture":openCapture();break;
    case"idea":openCapture(true);break;
    case"caparea":{const p=parse($("#capt").value);const cur=capArea!==null?capArea:p.area;capArea=cur===b.dataset.a?"":b.dataset.a;updParsed();break}
    case"reviewed":if(!k)break;k.review=false;k.done=true;k.doneAt=Date.now();save();render();toast("Idea revisada",()=>{k.review=true;k.done=false;k.doneAt=0;save();render()});break;
    case"al-ideas":answer();tab="inbox";render();scrollTo(0,0);break;
    case"capsave":capSave();break;
    case"capwhen":capWhen=b.dataset.w;updParsed();$("#capt").focus();break;
    case"mic":mic();break;
    case"close":closeSheet();break;
    case"settings":openSettings();break;
    case"toggle":if(!k)break;if(k.done){k.done=false;k.doneAt=0;save()}else complete(k,e);render();break;
    case"start":if(!k)break;startFocus(k.id,k.mins&&k.mins<=45?k.mins:25);break;
    case"notnow":if(!k)break;k.order=Date.now();save();toast("Vale, luego vuelve");render();break;
    case"star":if(!k)break;
      if(!k.important&&importants().length>=3){toast("Ya tienes 3 importantes. Quita una antes.");break}
      k.important=!k.important;if(k.status!=="today"){k.status="today";k.date=today()}save();render();break;
    case"edit":if(k)openEdit(k.id);break;
    case"when":if(k)whenPicker(k.id);break;
    case"move":if(!k)break;setWhen(k,b.dataset.to);save();closeSheet();render();toast(b.dataset.to==="today"?"Movido a hoy":"Guardado para algún día");break;
    case"setdate":{if(!k)break;let d=b.dataset.d;if(b.dataset.pick){d=($("#w-date")||{}).value;if(!d){toast("Elige una fecha");break}}setWhen(k,"date",d);save();closeSheet();toast("Para "+niceDate(d).toLowerCase());break}
    case"del":if(!k)break;{const copy=Object.assign({},k);S.tasks=S.tasks.filter(x=>x.id!==k.id);save();closeSheet();render();toast("Borrado",()=>{S.tasks.push(copy);save();render()})}break;
    case"delex":S.tasks=S.tasks.filter(x=>!x.ex);save();render();toast("Ejemplos borrados. Todo tuyo.");break;
    case"energy":S.energy=S.energy===b.dataset.e?"":b.dataset.e;save();render();break;
    case"ewhen":if(!k)break;setWhen(k,b.dataset.w);save();openEdit(k.id);break;
    case"etimeclear":if(!k)break;k.time="";save();openEdit(k.id);break;
    case"eenergy":if(!k)break;k.energy=k.energy===b.dataset.e?"":b.dataset.e;save();openEdit(k.id);break;
    case"emins":if(!k)break;k.mins=k.mins===+b.dataset.m?0:+b.dataset.m;save();openEdit(k.id);break;
    case"earea":if(!k)break;k.area=k.area===b.dataset.a?"":b.dataset.a;save();openEdit(k.id);break;
    /* foco */
    case"fclose":focusId=null;S.timer=null;save();$("#focus")&&$("#focus").remove();render();break;
    case"fdone":{const t=byId(focusId);focusId=null;$("#focus")&&$("#focus").remove();if(t)complete(t,e);render();break}
    case"fmore":{const m=+b.dataset.m;S.timer={id:focusId,end:Date.now()+m*60000,dur:m*60000,ended:false};save();drawFocus();break}
    /* rutinas */
    case"rcheck":{const d=((S.rlog[today()]||{})[r.id]||{})[b.dataset.i];rmark(r.id,b.dataset.i,!d);render();if(!d&&rDone(r)===r.items.length){celebrate(innerWidth/2,innerHeight/3);toast("Rutina completa")}break}
    case"rplay":if(r)playRoutine(r.id);break;
    case"rnext":rmark(r.id,b.dataset.i,true);rp=null;if(rDone(r)===r.items.length){closePlay();celebrate(innerWidth/2,innerHeight/2);toast("Rutina completa. Bien.");answerRoutine(r);render()}else playRoutine(r.id);break;
    case"rskipstep":{const l=(S.rlog[today()]||{})[r.id]||{};const rest=r.items.filter(x=>!l[x.id]);const i=rest.findIndex(x=>x.id===b.dataset.i);if(i>=0&&rest.length>1){const [it]=r.items.splice(r.items.indexOf(rest[i]),1);r.items.push(it);save()}rp=null;playRoutine(r.id);break}
    case"rclose":closePlay();render();break;
    case"rskip":if(r){S.notified["skip"+r.id+today()]=1;answerRoutine(r);render();toast("Vale, hoy no")}break;
    case"redit":editR=editR===r.id?null:r.id;render();break;
    case"radd":{const ti=$("#ri-"+r.id),mi=$("#rm-"+r.id);if(ti.value.trim()){r.items.push({id:uid(),text:ti.value.trim(),mins:+mi.value||0});save();render();$("#ri-"+r.id)&&$("#ri-"+r.id).focus()}break}
    case"rdel":r.items=r.items.filter(x=>x.id!==b.dataset.i);save();render();break;
    case"rremove":if(b.dataset.sure){S.routines=S.routines.filter(x=>x.id!==r.id);editR=null;save();render()}else{b.dataset.sure="1";b.textContent="Toca otra vez para borrar"}break;
    case"rnew":{const nr={id:uid(),name:"Nueva rutina",time:"",items:[]};S.routines.push(nr);editR=nr.id;save();render();setTimeout(()=>{const el=$("#rn-"+nr.id);el&&(el.focus(),el.select())},30);break}
    /* avisos */
    case"al-done":{const t=byId(alertQ&&alertQ.id);answer();if(t)complete(t,e);render();break}
    case"al-snooze":answer({snooze:Date.now()+15*60000,last:Date.now(),shown:true});toast("Te lo recuerdo en 15 minutos");break;
    case"al-tomorrow":{const t=byId(alertQ&&alertQ.id);answer();if(t){setWhen(t,"tomorrow");save()}render();toast("Movido a mañana");break}
    case"al-skip":{const rr=S.routines.find(x=>x.id===(alertQ&&alertQ.id));if(rr)S.notified["skip"+rr.id+today()]=1;answer();render();break}
    case"alr-go":{const id2=alertQ&&alertQ.id;answer();playRoutine(id2);break}
    /* ajustes */
    case"perm":try{Notification.requestPermission().then(()=>openSettings())}catch(e){toast("Este navegador no deja activar avisos")}break;
    case"sound":S.settings.sound=!S.settings.sound;save();if(S.settings.sound)beep();openSettings();break;
    case"nag":S.settings.nag=+b.dataset.n;save();openSettings();break;
    case"adel":S.areas=S.areas.filter(a=>a!==b.dataset.a);save();openSettings();break;
    case"aadd":{const v=$("#newarea").value.trim();if(v&&!S.areas.includes(v)){S.areas.push(v);save()}openSettings();break}
    case"bcopy":{const data=JSON.stringify(S);const ok=()=>toast("Copiado. Pégalo en una nota.");try{navigator.clipboard.writeText(data).then(ok,()=>fallbackCopy(data))}catch(e){fallbackCopy(data)}break}
    case"brestore":try{const n=JSON.parse($("#bpaste").value);if(!n||!n.tasks)throw 0;S=n;save();closeSheet();toast("Copia restaurada")}catch(e){toast("Ese texto no es una copia válida")}break;
    case"reset":if(b.dataset.sure){S=seed();S.tasks=[];save();closeSheet();toast("Empiezas de cero")}else{b.dataset.sure="1";b.textContent="Toca otra vez para borrar todo"}break;
    case"undo":{const el=$("#toast");if(el&&el._undo){el._undo();el.remove()}break}
  }
});
function answerRoutine(r){Object.keys(S.notified).forEach(k=>{if(k.startsWith("r"+r.id))S.notified[k].answered=true});const key="r"+r.id+r.time+today();S.notified[key]=Object.assign(S.notified[key]||{},{answered:true});if(alertQ&&alertQ.id===r.id)hideAlert();save()}
function fallbackCopy(data){const ta=$("#bpaste");if(ta){ta.value=data;ta.select();toast("Selecciona y copia el texto")}}
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.dataset.ef){const k=byId($("#scrim")&&$("#scrim").dataset.id);if(!k)return;const f=el.dataset.ef,v=el.value.trim();
    if(f==="text"&&v)k.text=v;else if(f==="step")k.step=v;else if(f==="time"){k.time=v;if(v&&k.status!=="later"&&k.status!=="today"){setWhen(k,"today")}}else if(f==="date"&&v){setWhen(k,"date",v)}
    save();if(f==="date"||f==="time")openEdit(k.id)}
  if(el.dataset.sf){S.settings[el.dataset.sf]=el.value;if(el.dataset.sf==="home")S.settings.homeSet=true;save()}
  if(el.dataset.rf){const r=S.routines.find(x=>x.id===el.dataset.r);if(!r)return;r[el.dataset.rf]=el.value.trim()||(el.dataset.rf==="name"?r.name:"");save()}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"){if($("#scrim"))closeSheet()}
  if(e.key==="Enter"&&e.target.id&&e.target.id.startsWith("ri-")){const b=e.target.parentElement.querySelector('[data-act="radd"]');b&&b.click()}
  if(e.key==="Enter"&&e.target.id==="newarea"){const b=document.querySelector('[data-act="aadd"]');b&&b.click()}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){rollover();if(!$("#scrim")&&!$("#focus"))render();checkReminders()}});

/* ---------- arranque ---------- */
load();render();
if(S.timer&&byId(S.timer.id)&&!S.timer.ended){focusId=S.timer.id;drawFocus()}
setInterval(()=>{tickFocus();tickRoutine()},1000);
setInterval(checkReminders,15000);setTimeout(checkReminders,1500);
window.addEventListener("storage",e=>{if(e.key===KEY){load();render()}});
})();
</script>

<script>if("serviceWorker" in navigator&&location.protocol!=="file:"){navigator.serviceWorker.register("sw.js").catch(()=>{})}</script>
